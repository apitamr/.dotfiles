# ── Prefix ────────────────────────────────────────────────────────────────────

# C-` needs a terminal that sends CSI-u (Ghostty does); prefix2 covers the rest
unbind C-b
set -g prefix C-`
set -g prefix2 C-b
bind C-` send-prefix

# ── Terminal ──────────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"

# Features are colon-separated; a comma would start a new terminal entry
set -as terminal-features ",xterm-ghostty:RGB:kitty-graphics:usstyle"

# ── General ───────────────────────────────────────────────────────────────────

set -s escape-time 0
set -g repeat-time 300
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g renumber-windows on
set -g allow-passthrough on
set -g aggressive-resize on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g display-time 2000

# -ga, not -g: -g replaces tmux's defaults (SSH_AUTH_SOCK etc.)
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment TERM_COLOR
set -ga update-environment GHOSTTY_RESOURCES_DIR
set -ga update-environment GHOSTTY_BIN_DIR

# Switching/attaching resets nvim's highlights; SIGUSR1 makes it reapply (nvim/lua/cmds.lua)
set-hook -g client-session-changed 'run-shell -b "pkill -USR1 -x nvim || true"'
set-hook -g client-attached 'run-shell -b "pkill -USR1 -x nvim || true"'

# ── Keys ──────────────────────────────────────────────────────────────────────

bind r source-file "${HOME}/.config/tmux/tmux.conf" \; display-message "config reloaded!"

bind W new-window -c "#{pane_current_path}"
bind S new-session -c "$HOME"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind = select-layout tiled

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r m select-window -t :+
bind -r n select-window -t :-

bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

bind C-c run "tmux save-buffer - | pbcopy"
bind C-v run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"
bind C-l send-keys -R \; send-keys C-l \; clear-history

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ── Status bar — kanso-zen ────────────────────────────────────────────────────

%hidden BAR="#707576"
%hidden DIM="#717C7C"
%hidden FAINT="#5C6066"
%hidden ACCENT="#87a987"
%hidden INK="#1C1E25"

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=$BAR"
set -g status-left-length 40
set -g status-right-length 40

# Session name, plus a red dot while the prefix is pending
set -g status-left " #[fg=$DIM]#S#[fg=#c34043]#{?client_prefix, ●,}#[fg=default] "

# No background fill on the current window: it makes the bar look tall
setw -g window-status-separator "  "
setw -g window-status-format "#[fg=$FAINT]#I #W#{?window_zoomed_flag, Z,}"
setw -g window-status-current-format "#[fg=$ACCENT,bold]#I #W#{?window_zoomed_flag, Z,}#[nobold]"
setw -g window-status-activity-style "fg=$ACCENT"

set -g status-right "#[fg=$DIM]#{?pane_in_mode,#{pane_mode} #[fg=$FAINT]│ ,}#[fg=$FAINT]%Y-%m-%d #[fg=$DIM]󰅐 #[fg=$BAR]%H:%M "

set -g pane-border-style "fg=#393B44"
set -g pane-active-border-style "fg=$ACCENT"
set -g pane-border-lines heavy

set -g message-style "bg=#22262D,fg=#C5C9C7"
set -g message-command-style "bg=#22262D,fg=#C5C9C7"
set -g mode-style "fg=$INK,bg=$ACCENT"
set -g display-panes-active-colour "$ACCENT"
set -g display-panes-colour "$FAINT"
