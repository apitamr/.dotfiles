# tmux.conf — minimal config with kanso-zen status bar

# Prefix: C-`
unbind C-b
set -g prefix C-`
bind C-` send-prefix

# General
set -sg escape-time 0
set -g repeat-time 300
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g renumber-windows on

# True color + undercurl
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Keybindings
bind r source-file ~/.tmux.conf \; display-message "config reloaded!"
bind C-l send-keys -R \; send-keys C-l \; clear-history
bind W new-window
bind S new-session
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r m select-window -t :+
bind -r n select-window -t :-
bind = select-layout tiled
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -r H resize-pane -L 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10
bind -r J resize-pane -D 10
bind C-c run "tmux save-buffer - | pbcopy"
bind C-v run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"

# Status bar — kanso-zen palette
# bg:default  dim:#5C6066  muted:#717C7C  fg:#C5C9C7  green:#87a987
set -g status-position top
set -g status-style "bg=default,fg=#5C6066"
set -g status-justify left
set -g status-left "#[fg=#717C7C] #S  "
set -g status-right "#[fg=#5C6066]%Y-%m-%d %H:%M "
set -g status-left-length 20
set -g status-right-length 20

# Window tabs — dimmed inactive, green active, centered
set -g window-status-format "#[fg=#5C6066] #I #W "
set -g window-status-current-format "#[fg=#1C1E25,bg=#87a987] #I #W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#393B44"
set -g pane-active-border-style "fg=#717C7C"

# Messages
set -g message-style "bg=#22262D,fg=#C5C9C7"
set -g message-command-style "bg=#22262D,fg=#C5C9C7"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
# Init TPM
run '~/.tmux/plugins/tpm/tpm'
